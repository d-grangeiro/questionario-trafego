<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico de Tráfego Pago</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <section id="login-section" class="card">
      <h1>Área do Cliente</h1>
      <p class="subtitle">Acesse para responder ao questionário.</p>
      <form id="login-form">
        <label>E-mail<input type="email" id="email" required /></label>
        <label>Senha<input type="password" id="password" required /></label>
        <button type="submit">Entrar</button>
        <p class="helper-text">Caso ainda não tenha acesso, entre em contacto com o suporte.</p>
        <p id="login-error" class="error hidden">E-mail ou senha inválidos.</p>
      </form>
    </section>

    <section id="wizard-section" class="card hidden">
      <header class="wizard-header">
        <div>
          <h2>Formulário de Diagnóstico</h2>
          <p id="question-counter">Pergunta 1 de 1</p>
        </div>
        <div class="meta">
          <span id="total-questions">Total: 0 perguntas</span>
          <span id="avg-time">Tempo médio: ~0 minutos</span>
        </div>
      </header>
      <div class="progress-container"><div id="progress-bar"></div></div>
      <div id="question-container"></div>
      <div class="nav-buttons">
        <button id="prev-btn" type="button">Voltar</button>
        <button id="next-btn" type="button">Próximo</button>
      </div>
      <footer class="wizard-footer"><span id="client-info"></span></footer>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
