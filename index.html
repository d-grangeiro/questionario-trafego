<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Onboarding de Tráfego Pago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Tela de Login -->
    <section id="login-section" class="card">
      <h1>Área do Cliente</h1>
      <p class="subtitle">
        Acesse para responder ao questionário e nos ajudar a criar campanhas de tráfego com leads quentes.
      </p>

      <form id="login-form">
        <label>
          Nome do cliente
          <input type="text" id="clientName" required />
        </label>

        <label>
          Nome da empresa
          <input type="text" id="companyName" required />
        </label>

        <!-- "Senha simples" só para evitar acesso casual.
             Depois podemos evoluir para algo mais forte. -->
        <label>
          Código de acesso
          <input type="password" id="accessCode" required />
        </label>

        <button type="submit">Entrar</button>
        <p id="login-error" class="error hidden">
          Código de acesso inválido. Verifique com o suporte.
        </p>
      </form>
    </section>

    <!-- Tela do Questionário -->
    <section id="wizard-section" class="card hidden">
      <header class="wizard-header">
        <div>
          <h2>Briefing de Tráfego Pago</h2>
          <p id="question-counter">Pergunta 1 de 1</p>
        </div>
        <div class="meta">
          <span id="total-questions">Total: 0 perguntas</span>
          <span id="avg-time">Tempo médio: ~0 minutos</span>
        </div>
      </header>

      <!-- Barra de progresso -->
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>

      <!-- Pergunta atual -->
      <div id="question-container">
        <!-- Renderizado via JS -->
      </div>

      <!-- Navegação -->
      <div class="nav-buttons">
        <button id="prev-btn" type="button">Voltar</button>
        <button id="next-btn" type="button">Próximo</button>
      </div>

      <!-- Info do cliente fixada no rodapé -->
      <footer class="wizard-footer">
        <span id="client-info"></span>
      </footer>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
